@import url(\'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap\');
:root{

}
html[data-theme="dark"]{

  --accent:#C6F135;

*{box-sizing:border-box;}
html{overflow-x:hidden; width:100%;}
body{ margin:0; background:var(--bg); color:var(--ink); font-family:\'Inter\',sans-serif; }
.wrap{ max-width:720px; margin:0 auto; padding:52px 24px 80px; }

.eyebrow{ color:var(--accent); font-weight:700; font-size:12px; letter-spacing:1px; text-transform:uppercase; display:flex; align-items:center; gap:8px; }
.eyebrow::before{ content:\'\'; width:7px; height:7px; border-radius:50%; background:var(--accent); }

.subhead{ color:var(--ink-dim); font-size:14px; margin-bottom:22px; }
.back-link{ font-size:13px; color:var(--ink-dim); text-decoration:none; font-weight:600; }
.back-link:hover{ color:var(--accent); }

#search{
  width:100%; padding:14px 18px; border:1px solid var(--line); border-radius:14px;
  background:var(--surface); color:var(--ink); font-family:inherit; font-size:15px;

}
#search:focus{ outline:none; border-color:var(--accent); }
.hint{ font-size:12px; color:var(--ink-dim); margin-bottom:20px; }

.filter-row{ display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
.filter-pill{
  font-size:11.5px; font-weight:700; padding:6px 13px; border-radius:999px;
  border:1px solid var(--line); background:var(--surface); color:var(--ink-dim); cursor:pointer;
}
.filter-pill.active{ background:var(--accent); color:var(--on-accent); border-color:var(--accent); }

.results{ display:flex; flex-direction:column; gap:6px; }
.result{
  display:flex; align-items:center; gap:12px; text-decoration:none; color:var(--ink);
  background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 16px;
}
.result:hover{ border-color:var(--accent); background:var(--accent-soft); }
.result-type{
  font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:0.5px;
  padding:3px 8px; border-radius:999px; flex-shrink:0; color:#fff; min-width:64px; text-align:center;
}
.result-type.tool{ background:#4640DE; }
.result-type.cert{ background:#F2994A; }
.result-type.glossary{ background:#3D8BFF; }
.result-type.specialty{ background:#7A9900; }
.result-type.page{ background:#8A8A93; }
.result-label{ font-size:14px; font-weight:600; min-width:0; overflow-wrap:break-word; flex:1; }
.empty{ text-align:center; color:var(--ink-dim); font-size:13.5px; padding:40px 20px; }

.theme-toggle{
  width:38px; height:38px; border-radius:50%;
  background:var(--surface); border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; box-shadow:var(--shadow); color:var(--ink);
  position:fixed; top:16px; right:16px; z-index:999;
}
.theme-toggle svg{ width:17px; height:17px; }
.theme-toggle .icon-moon{ display:none; }
html[data-theme="dark"] .theme-toggle .icon-sun{ display:none; }
html[data-theme="dark"] .theme-toggle .icon-moon{ display:block; }

/* PAGE FADE TRANSITION */
body{ animation: pageFadeIn 0.32s ease; }
@keyframes pageFadeIn{ from{ opacity:0; } to{ opacity:1; } }
body.page-fade-out{ opacity:0 !important; transition: opacity 0.22s ease; }
@media (prefers-reduced-motion: reduce){
  body{ animation:none; }
  body.page-fade-out{ transition:none; }
}

let activeFilter = 'all';

function render(query){
  const q = query.trim().toLowerCase();
  const filtered = ENTRIES.filter(e => {
    const matchesFilter = activeFilter === 'all' || e.type === activeFilter;
    const matchesQuery = !q || e.label.toLowerCase().includes(q);
    return matchesFilter && matchesQuery;
  });

  const wrap = document.getElementById('results');
  wrap.innerHTML = '';
  if(!filtered.length){
    wrap.innerHTML = '<div class="empty">No matches. Try a different term.</div>';
    return;
  }
  filtered.slice(0, 60).forEach(e => {
    const a = document.createElement('a');
    a.className = 'result';
    a.href = e.url;
    a.innerHTML = `<span class="result-type ${e.type}">${e.type}</span><span class="result-label">${e.label}</span>`;
    wrap.appendChild(a);
  });
}

document.getElementById('search').addEventListener('input', (e) => render(e.target.value));

document.getElementById('filterRow').addEventListener('click', (e) => {
  const btn = e.target.closest('.filter-pill');
  if(!btn) return;
  document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  activeFilter = btn.getAttribute('data-filter');
  render(document.getElementById('search').value);
});

render('');

(function(){

  btn.addEventListener('click', function(){

    var current = html.getAttribute('data-theme') || 'light';
    var next = current === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    try{ localStorage.setItem('sec-roadmap-theme', next); }catch(e){}

})();

<script>
(function(){
  function navigateWithFade(href){
    document.body.classList.add('page-fade-out');
    setTimeout(function(){ window.location.href = href; }, 220);
  }
  window.navigateWithFade = navigateWithFade;

  document.addEventListener('click', function(e){
    var a = e.target.closest('a');
    if(!a) return;
    var href = a.getAttribute('href');
    if(!href) return;
    if(href.startsWith('#') || href.startsWith('http') || href.startsWith('mailto:')) return;
    if(a.target === '_blank' || e.metaKey || e.ctrlKey || e.shiftKey) return;
    e.preventDefault();
    navigateWithFade(href);
  });

  window.addEventListener('pageshow', function(e){
    if(e.persisted) document.body.classList.remove('page-fade-out');
  });
})();
</script>
